<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Jenis Surat - SIPERATA</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="mb-4 text-center">Manajemen Jenis Surat (SIPERATA)</h2>

        <!-- Form Tambah / Edit -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 id="form-title" class="mb-0">Tambah Jenis Surat Baru</h5>
            </div>
            <div class="card-body">
                <form id="suratForm">
                    <input type="hidden" id="suratId">
                    <div class="mb-3">
                        <label for="nama_surat" class="form-label">Nama Surat</label>
                        <input type="text" class="form-control" id="nama_surat" required>
                    </div>
                    <div class="mb-3">
                        <label for="kategori" class="form-label">Kategori</label>
                        <input type="text" class="form-control" id="kategori">
                    </div>
                    <div class="mb-3">
                        <label for="persyaratan" class="form-label">Persyaratan</label>
                        <textarea class="form-control" id="persyaratan" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success" id="btn-save">Simpan Data</button>
                    <button type="button" class="btn btn-secondary d-none" id="btn-cancel" onclick="resetForm()">Batal</button>
                </form>
            </div>
        </div>

        <!-- Tabel Data -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Daftar Jenis Surat</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-bordered align-middle">
                        <thead>
                            <tr>
                                <th width="5%">ID</th>
                                <th width="25%">Nama Surat</th>
                                <th width="25%">Kategori</th>
                                <th width="30%">Persyaratan</th>
                                <th width="15%" class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="suratTableBody">
                            <!-- Data akan dimuat melalui JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript / Fetch API tanpa pop-up -->
    <script>
        const API_URL = 'http://localhost/pemweb-obe/api/jenis_surat.php';

        async function loadSurat() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                const tbody = document.getElementById('suratTableBody');
                tbody.innerHTML = '';

                // Menyesuaikan apakah respons berupa array langsung atau objek dengan properti .data
                const suratList = Array.isArray(result) ? result : (result.data || []);

                if (suratList.length > 0) {
                    suratList.forEach(item => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${item.id}</td>
                                <td>${item.nama_surat}</td>
                                <td>${item.kategori ?? '-'}</td>
                                <td>${item.persyaratan ?? '-'}</td>
                                <td class="text-center">
                                    <button class="btn btn-warning btn-sm me-1" onclick="editData(${item.id}, '${item.nama_surat}', '${item.kategori ?? ''}', '${item.persyaratan ?? ''}')">Edit</button>
                                    <button class="btn btn-danger btn-sm" onclick="deleteData(${item.id})">Hapus</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">Belum ada data jenis surat</td></tr>`;
                }
            } catch (error) {
                console.error('Gagal memuat data:', error);
            }
        }

        document.getElementById('suratForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('suratId').value;
            const data = {
                nama_surat: document.getElementById('nama_surat').value,
                kategori: document.getElementById('kategori').value,
                persyaratan: document.getElementById('persyaratan').value
            };

            let url = API_URL;
            let method = 'POST';

            if (id) {
                url = `${API_URL}?id=${id}`;
                method = 'PUT';
            }

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                
                if (response.ok) {
                    resetForm();
                    loadSurat();
                } else {
                    alert(result.error.message);
                }
            } catch (error) {
                console.error('Terjadi kesalahan:', error);
            }
        });

        function editData(id, nama_surat, kategori, persyaratan) {
            document.getElementById('suratId').value = id;
            document.getElementById('nama_surat').value = nama_surat;
            document.getElementById('kategori').value = kategori !== 'null' ? kategori : '';
            document.getElementById('persyaratan').value = persyaratan !== 'null' ? persyaratan : '';
            document.getElementById('form-title').innerText = 'Edit Jenis Surat (ID: ' + id + ')';
            document.getElementById('btn-save').innerText = 'Update Data';
            document.getElementById('btn-cancel').classList.remove('d-none');
        }

        function resetForm() {
            document.getElementById('suratForm').reset();
            document.getElementById('suratId').value = '';
            document.getElementById('form-title').innerText = 'Tambah Jenis Surat Baru';
            document.getElementById('btn-save').innerText = 'Simpan Data';
            document.getElementById('btn-cancel').classList.add('d-none');
        }

       async function deleteData(id) {
            // Memunculkan kotak dialog konfirmasi sebelum menghapus
            if (confirm('Apakah kamu yakin ingin menghapus jenis surat ini?')) {
                try {
                    const response = await fetch(`${API_URL}?id=${id}`, {
                        method: 'DELETE'
                    });
                    const result = await response.json();

                    if (response.ok) {
                        loadSurat(); // Tabel langsung diperbarui otomatis
                    } else {
                        alert(result.error.message);
                    }
                } catch (error) {
                    console.error('Gagal menghapus data:', error);
                }
            }
        }

        // Panggil fungsi load saat halaman pertama kali dibuka
        loadSurat();
    </script>
</body>
</html>
